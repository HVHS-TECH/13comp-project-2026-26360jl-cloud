<!DOCTYPE html>
<html>
    <head>
        <script src="https://www.gstatic.com/firebasejs/8.1.2/firebase-app.js"></script>
        <script src="https://www.gstatic.com/firebasejs/8.1.2/firebase-auth.js"></script>
        <script src="https://www.gstatic.com/firebasejs/8.1.2/firebase-database.js"></script>
        <script src="https://www.gstatic.com/firebasejs/8.1.2/firebase-analytics.js"></script>
        <script src="scripts/fb_setup.js"></script>
        <script src="scripts/signup.js"></script>
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
        <link href="css/style.css" rel="stylesheet"/>
        <link href="css/signup.css" rel="stylesheet"/>
    </head>
    <body>
        <div class="modalT" id="modal">
            <div class="modal-inner">
            <h2>Register account: </h2>
            <br>
            <input class="form-control" placeholder="Age: " type="number" min="5" max="99" step="1.0" id="age">
            <div class="sameline">
            <label class="onelinechild">Gender: </label><select class="onelinechild form-select" id="gender">
                <option value="male">Male</option>
                <option value="female">Female</option>
                <option value="other">Other</option>
            </select>
            </div>
            <input class="form-control" placeholder="Address: " id="address">
            <br>
            <button class="btn btn-dark" onclick="signup()">Signup</button>
            </div>
        </div>
    </body>
</html>
