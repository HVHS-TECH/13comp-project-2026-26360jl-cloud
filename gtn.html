<!DOCTYPE html>
<html>
    <head>
        <script src="https://www.gstatic.com/firebasejs/8.1.2/firebase-app.js"></script>
        <script src="https://www.gstatic.com/firebasejs/8.1.2/firebase-auth.js"></script>
        <script src="https://www.gstatic.com/firebasejs/8.1.2/firebase-database.js"></script>
        <script src="https://www.gstatic.com/firebasejs/8.1.2/firebase-analytics.js"></script>
        <script src="scripts/fb_setup.js"></script>
        <script src="scripts/confirm_login.js"></script>
        <script src="scripts/leaderboard_util.js"></script>
        <script src="scripts/gtn_queue.js"></script>
        <script src="scripts/gtn_game.js"></script>
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
        <link href="css/style.css" rel="stylesheet"/>
        <link href="css/navbar.css" rel="stylesheet"/>
    </head>
    <body>
        <div id="header-container"></div>
        <script src="scripts/navbar.mjs"></script>
        
        <h1>Guess the number</h1>
        <div class="padding">
            <div id="flexbox">
                <img id="profile" class="" src=""><a id="vsTag">       vs      </a><img id="opponent" src="" class="">
            </div>
            <div id="queue">
                <button class="btn btn-outline-dark" onclick="joinQueue()">Queue</button>
                <button class="btn btn-outline-dark" onclick="leaveQueue()">Leave queue</button>
                <p id="queueCount">0 players in queue</p>
            </div>
            <div id="game">
                <h3 id="turnTracker">it is your turn</h3>
                <span class="game-components"><input class="form-control guess-input" id="guessInput" placeholder="enter your guess here:" type="number"><button class="btn btn-outline-dark" id="guessButton" onclick="sendTurn()">guess</button></span>
                <p id="gameStatus">A guessed 5 too low!</p>
                <button class="btn btn-dark" id="postGameButton"><a class="link-underline link-underline-opacity-0" href="">go back to queue</a></button>
            </div>
        </div>
    </body>
</html>
